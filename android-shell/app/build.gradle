plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 签名：release 可通过仓库 Secrets 注入正式 keystore；
// debug 在 CI 中使用仓库内固定的测试 keystore，这样每次 Actions 产物都能覆盖安装，
// 不会因为 GitHub Runner 每次生成不同 debug key 而被迫卸载 App。
def ksFile = System.getenv("SHELL_KEYSTORE_FILE")
def debugKsFile = System.getenv("SHELL_DEBUG_KEYSTORE_FILE")
def siteUrl = (System.getenv("SHELL_SITE_URL") ?: "https://example.invalid").replaceAll('/+$', '')

android {
    namespace 'app.floatphone.shell'
    compileSdk 34

    defaultConfig {
        applicationId "app.floatphone.shell"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "SITE_URL", "\"${siteUrl}\""
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        if (debugKsFile) {
            ciDebug {
                storeFile file(debugKsFile)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        if (ksFile) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv("SHELL_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SHELL_KEY_ALIAS")
                keyPassword System.getenv("SHELL_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (debugKsFile) signingConfig signingConfigs.ciDebug
        }
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
