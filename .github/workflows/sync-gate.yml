name: Cognitive Migration Sync Gate

on:
  push:
    branches:
      - sync-gate/297fc802

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact merge commit
        uses: actions/checkout@v4
        with:
          ref: 297fc802a51335de145d364a6b59855ccc2db8ef

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm test
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: npm run build
        run: npm run build
