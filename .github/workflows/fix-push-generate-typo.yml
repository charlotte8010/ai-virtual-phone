name: One-shot fix push-generate typo

on:
  push:
    branches:
      - feature/cognitive-memory

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cognitive-memory
      - name: Fix typo and remove one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/push-generate/index.ts')
          text = path.read_text(encoding='utf-8')
          old = 'const body = await encryptWebPushPayload(p256dhB64, authB64, payload);'
          new = 'const body = await encryptWebPushPayload(sub.p256dh, sub.auth, payload);'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one typo, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/fix-push-generate-typo.yml
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/push-generate/index.ts .github/workflows/fix-push-generate-typo.yml
          git commit -m "fix: correct push encryption inputs"
          git push origin HEAD:feature/cognitive-memory
