name: Fix world-builder mobile flow and plugin cleanup

on:
  push:
    paths:
      - '.github/workflows/fix-worldbuilder-plugin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1) Float/PWA: 筑境在当前 WebView 内打开，不再 window.open 到外部浏览器。
          p = Path('components/desktop-shell.tsx')
          s = p.read_text(encoding='utf-8')
          needle = '''function openWorldBuilder(path: string): void {\n  const targetUrl = new URL(path, window.location.origin).toString();\n'''
          repl = '''function openWorldBuilder(path: string): void {\n  const targetUrl = new URL(path, window.location.origin).toString();\n  const standaloneNavigator = navigator as Navigator & { standalone?: boolean };\n  const isAppLikeDisplay =\n    Boolean((window as Window & { AndroidShell?: unknown }).AndroidShell) ||\n    window.matchMedia("(display-mode: standalone)").matches ||\n    window.matchMedia("(display-mode: fullscreen)").matches ||\n    Boolean(standaloneNavigator.standalone);\n\n  // Android WebView/PWA 不支持这里的桌面式 popup 语义；_blank 会被壳层当作外链。\n  if (isAppLikeDisplay) {\n    window.location.assign(targetUrl);\n    return;\n  }\n'''
          if needle not in s:
              raise SystemExit('desktop-shell openWorldBuilder marker not found')
          s = s.replace(needle, repl, 1)
          p.write_text(s, encoding='utf-8')

          # 2) 筑境返回：有 opener 才 close；同页 WebView 使用 history，最后兜底首页。
          p = Path('components/world-builder/WorldBuilder.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''  const handleInitialBootBack = useCallback(() => {\n    if (window.opener && !window.opener.closed) {\n      window.opener.focus();\n    }\n    window.close();\n    window.setTimeout(() => {\n      if (!window.closed) window.location.replace("/");\n    }, 40);\n  }, []);'''
          new = '''  const handleBack = useCallback(() => {\n    if (window.opener && !window.opener.closed) {\n      window.opener.focus();\n      window.close();\n      window.setTimeout(() => {\n        if (!window.closed) window.location.replace("/");\n      }, 80);\n      return;\n    }\n\n    if (window.history.length > 1) {\n      const currentUrl = window.location.href;\n      window.history.back();\n      // 某些 Android WebView history.back() 会被拦住；仍停在原页时回首页。\n      window.setTimeout(() => {\n        if (window.location.href === currentUrl) window.location.replace("/");\n      }, 260);\n      return;\n    }\n\n    window.location.replace("/");\n  }, []);'''
          if old not in s:
              raise SystemExit('WorldBuilder back handler marker not found')
          s = s.replace(old, new, 1)
          s = s.replace('onClick={() => window.close()}', 'onClick={handleBack}', 1)
          s = s.replace('onClick={handleInitialBootBack}', 'onClick={handleBack}', 1)
          p.write_text(s, encoding='utf-8')

          # 3) 筑境手机 UI：dvh + 安全区 + 可触摸顶栏/底栏 + 属性底板 + 手机弹窗。
          p = Path('styles/world-builder.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* ── Float / handset world-builder adaptation ── */'
          if marker not in s:
              s += r'''

/* ── Float / handset world-builder adaptation ── */
@media (max-width: 720px), (pointer: coarse) {
  .wb-layout {
    width: 100%;
    height: 100dvh;
    min-height: 100dvh;
    padding-top: 0;
  }

  .wb-topbar {
    top: env(safe-area-inset-top, 0px);
    left: 8px;
    right: 8px;
    height: 52px;
    gap: 6px;
    padding: 6px 0;
    scrollbar-width: none;
  }

  .wb-topbar::-webkit-scrollbar,
  .wb-categories::-webkit-scrollbar,
  .wb-model-list::-webkit-scrollbar {
    display: none;
  }

  .wb-topbar-btn {
    min-height: 38px;
    padding: 7px 11px;
    font-size: calc(12px * var(--app-text-scale, 1));
    touch-action: manipulation;
  }

  .wb-bottom-bar {
    left: 8px;
    right: 8px;
    bottom: 0;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-bottom: 0;
    border-radius: 16px 16px 0 0;
    padding-bottom: max(6px, env(safe-area-inset-bottom, 0px));
    max-height: min(34dvh, 230px);
  }

  .wb-palette-header {
    padding: 6px 10px;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
  }

  .wb-palette-header h2 {
    font-size: calc(13px * var(--app-text-scale, 1));
  }

  .wb-tabs {
    flex-shrink: 0;
  }

  .wb-tabs button {
    min-height: 34px;
    padding: 6px 12px;
    font-size: calc(12px * var(--app-text-scale, 1));
  }

  .wb-categories {
    padding: 5px 10px;
  }

  .wb-categories button {
    min-height: 32px;
    padding: 5px 11px;
    font-size: calc(11px * var(--app-text-scale, 1));
  }

  .wb-model-list {
    min-height: 78px;
    padding: 5px 8px;
    gap: 7px;
  }

  .wb-model-item {
    padding: 5px;
    border-radius: 11px;
  }

  .wb-model-thumb {
    width: 52px;
    height: 52px;
    border-radius: 8px;
  }

  .wb-model-name {
    max-width: 58px;
    font-size: calc(10px * var(--app-text-scale, 1));
  }

  .wb-float-panel {
    position: fixed;
    top: auto;
    left: 8px;
    right: 8px;
    bottom: calc(min(34dvh, 230px) + env(safe-area-inset-bottom, 0px) + 8px);
    width: auto;
    max-height: 36dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 12px 14px;
    border-radius: 16px;
  }

  .wb-modal-overlay {
    align-items: flex-end;
    padding: env(safe-area-inset-top, 0px) 8px 0;
  }

  .wb-modal {
    width: 100%;
    max-width: 520px;
    max-height: calc(88dvh - env(safe-area-inset-top, 0px));
    padding: 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
    border-radius: 20px 20px 0 0;
  }

  .wb-placing-hint {
    bottom: calc(min(34dvh, 230px) + env(safe-area-inset-bottom, 0px) + 10px);
    max-width: calc(100vw - 24px);
    padding: 7px 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .wb-model-loading-toast {
    bottom: calc(min(34dvh, 230px) + env(safe-area-inset-bottom, 0px) + 12px);
  }

  .wb-avatar-card-overlay {
    padding: env(safe-area-inset-top, 0px) 12px env(safe-area-inset-bottom, 0px);
  }
}
'''
          p.write_text(s, encoding='utf-8')

          # 4) JS 插件宿主兜底：记录 setup/import 阶段对 html/body 和背景节点的全局副作用；停用时回滚。
          p = Path('lib/chat-plugin-runtime.ts')
          s = p.read_text(encoding='utf-8')

          active_old = '''type ActivePlugin = {\n    installed: InstalledChatPlugin;\n    disposables: Disposable[];\n    settingsListeners: Set<(settings: Record<string, unknown>) => void>;\n    lastSettingsJson: string;\n};'''
          active_new = '''type ActivePlugin = {\n    installed: InstalledChatPlugin;\n    disposables: Disposable[];\n    settingsListeners: Set<(settings: Record<string, unknown>) => void>;\n    lastSettingsJson: string;\n    globalDomRollback?: Disposable;\n};\n\ntype InlineStyleValue = { value: string; priority: string };\ntype GlobalElementSnapshot = { classes: Set<string>; styles: Map<string, InlineStyleValue> };\ntype GlobalDomSnapshot = {\n    html: GlobalElementSnapshot;\n    body: GlobalElementSnapshot;\n    headStyles: Set<HTMLStyleElement>;\n    bodyChildren: Set<Element>;\n};\n\nfunction captureElementSnapshot(el: HTMLElement): GlobalElementSnapshot {\n    const styles = new Map<string, InlineStyleValue>();\n    for (let i = 0; i < el.style.length; i += 1) {\n        const property = el.style.item(i);\n        if (!property) continue;\n        styles.set(property, {\n            value: el.style.getPropertyValue(property),\n            priority: el.style.getPropertyPriority(property),\n        });\n    }\n    return { classes: new Set(el.classList), styles };\n}\n\nfunction captureGlobalDomSnapshot(): GlobalDomSnapshot | null {\n    if (typeof document === "undefined" || !document.documentElement || !document.body) return null;\n    const headStyles = new Set<HTMLStyleElement>();\n    for (const node of Array.from(document.head?.children ?? [])) {\n        if (node instanceof HTMLStyleElement) headStyles.add(node);\n    }\n    return {\n        html: captureElementSnapshot(document.documentElement),\n        body: captureElementSnapshot(document.body),\n        headStyles,\n        bodyChildren: new Set(Array.from(document.body.children)),\n    };\n}\n\nfunction sameInlineStyle(a?: InlineStyleValue, b?: InlineStyleValue): boolean {\n    if (!a && !b) return true;\n    if (!a || !b) return false;\n    return a.value === b.value && a.priority === b.priority;\n}\n\nfunction makeElementRollback(el: HTMLElement, before: GlobalElementSnapshot, after: GlobalElementSnapshot): Disposable {\n    const addedClasses = [...after.classes].filter((name) => !before.classes.has(name));\n    const removedClasses = [...before.classes].filter((name) => !after.classes.has(name));\n    const changedStyles = new Set([...before.styles.keys(), ...after.styles.keys()]);\n    for (const property of [...changedStyles]) {\n        if (sameInlineStyle(before.styles.get(property), after.styles.get(property))) changedStyles.delete(property);\n    }\n\n    return () => {\n        for (const name of addedClasses) {\n            if (el.classList.contains(name)) el.classList.remove(name);\n        }\n        for (const name of removedClasses) {\n            if (!el.classList.contains(name)) el.classList.add(name);\n        }\n        for (const property of changedStyles) {\n            const current: InlineStyleValue | undefined = el.style.getPropertyValue(property)\n                ? { value: el.style.getPropertyValue(property), priority: el.style.getPropertyPriority(property) }\n                : undefined;\n            const pluginValue = after.styles.get(property);\n            // 只回滚仍保持插件写入值的属性，避免覆盖宿主随后做的合法修改。\n            if (!sameInlineStyle(current, pluginValue)) continue;\n            const original = before.styles.get(property);\n            if (original) el.style.setProperty(property, original.value, original.priority);\n            else el.style.removeProperty(property);\n        }\n    };\n}\n\nfunction createGlobalDomRollback(before: GlobalDomSnapshot | null, after: GlobalDomSnapshot | null): Disposable | undefined {\n    if (!before || !after || typeof document === "undefined") return undefined;\n    const rollHtml = makeElementRollback(document.documentElement, before.html, after.html);\n    const rollBody = makeElementRollback(document.body, before.body, after.body);\n    const addedHeadStyles = [...after.headStyles].filter((node) => !before.headStyles.has(node));\n    const addedBodyChildren = [...after.bodyChildren].filter((node) => !before.bodyChildren.has(node));\n\n    return () => {\n        rollBody();\n        rollHtml();\n        // raw-DOM 动态背景插件常直接向 head/body 挂 style/canvas/video 容器。\n        for (const node of addedHeadStyles) {\n            if (node.isConnected) node.remove();\n        }\n        for (const node of addedBodyChildren) {\n            if (node.isConnected) node.remove();\n        }\n    };\n}'''
          if active_old not in s:
              raise SystemExit('chat-plugin-runtime ActivePlugin marker not found')
          s = s.replace(active_old, active_new, 1)

          start_old = '''    private async startPlugin(installed: InstalledChatPlugin): Promise<void> {\n        const pluginId = installed.manifest.id;\n        if (this.active.has(pluginId)) return;\n        const { module, error } = await loadChatPluginModule(installed.code);\n        if (!module) {\n            recordChatPluginLog({ pluginId, where: "setup", message: error ?? "加载失败", level: "error" });\n            return;\n        }\n        if (module.manifest.id !== pluginId) {\n            recordChatPluginLog({ pluginId, where: "setup", message: `源码内 manifest.id（${module.manifest.id}）与安装记录不一致，已拒绝加载`, level: "error" });\n            return;\n        }\n        const activePlugin: ActivePlugin = {\n            installed,\n            disposables: [],\n            settingsListeners: new Set(),\n            lastSettingsJson: JSON.stringify(installed.settings ?? {}),\n        };\n        this.active.set(pluginId, activePlugin);\n        try {\n            const ctx = this.buildCtx(activePlugin);\n            const cleanup = await module.setup(ctx);\n            if (typeof cleanup === "function") activePlugin.disposables.push(cleanup);\n        } catch (e) {\n            recordChatPluginLog({ pluginId, where: "setup", message: e instanceof Error ? e.message : String(e), level: "error" });\n            await this.stopPlugin(pluginId);\n        }\n    }'''
          start_new = '''    private async startPlugin(installed: InstalledChatPlugin): Promise<void> {\n        const pluginId = installed.manifest.id;\n        if (this.active.has(pluginId)) return;\n        // import 本身也会执行插件顶层代码，因此快照必须在 import 之前。\n        const globalDomBefore = captureGlobalDomSnapshot();\n        const { module, error } = await loadChatPluginModule(installed.code);\n        if (!module) {\n            createGlobalDomRollback(globalDomBefore, captureGlobalDomSnapshot())?.();\n            recordChatPluginLog({ pluginId, where: "setup", message: error ?? "加载失败", level: "error" });\n            return;\n        }\n        if (module.manifest.id !== pluginId) {\n            createGlobalDomRollback(globalDomBefore, captureGlobalDomSnapshot())?.();\n            recordChatPluginLog({ pluginId, where: "setup", message: `源码内 manifest.id（${module.manifest.id}）与安装记录不一致，已拒绝加载`, level: "error" });\n            return;\n        }\n        const activePlugin: ActivePlugin = {\n            installed,\n            disposables: [],\n            settingsListeners: new Set(),\n            lastSettingsJson: JSON.stringify(installed.settings ?? {}),\n        };\n        this.active.set(pluginId, activePlugin);\n        try {\n            const ctx = this.buildCtx(activePlugin);\n            const cleanup = await module.setup(ctx);\n            if (typeof cleanup === "function") activePlugin.disposables.push(cleanup);\n            activePlugin.globalDomRollback = createGlobalDomRollback(globalDomBefore, captureGlobalDomSnapshot());\n        } catch (e) {\n            activePlugin.globalDomRollback = createGlobalDomRollback(globalDomBefore, captureGlobalDomSnapshot());\n            recordChatPluginLog({ pluginId, where: "setup", message: e instanceof Error ? e.message : String(e), level: "error" });\n            await this.stopPlugin(pluginId);\n        }\n    }'''
          if start_old not in s:
              raise SystemExit('chat-plugin-runtime startPlugin marker not found')
          s = s.replace(start_old, start_new, 1)

          stop_old = '''        activePlugin.disposables.length = 0;\n        activePlugin.settingsListeners.clear();\n        getChatPluginHookBus().removePlugin(pluginId);'''
          stop_new = '''        activePlugin.disposables.length = 0;\n        // 插件自己的 cleanup 先执行；随后再清理它遗漏的全局 DOM/CSS 副作用。\n        try { activePlugin.globalDomRollback?.(); } catch { /* 兜底清理失败不阻塞 */ }\n        activePlugin.globalDomRollback = undefined;\n        activePlugin.settingsListeners.clear();\n        getChatPluginHookBus().removePlugin(pluginId);'''
          if stop_old not in s:
              raise SystemExit('chat-plugin-runtime stopPlugin marker not found')
          s = s.replace(stop_old, stop_new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Sanity checks
        shell: bash
        run: |
          grep -q 'isAppLikeDisplay' components/desktop-shell.tsx
          grep -q 'const handleBack' components/world-builder/WorldBuilder.tsx
          grep -q 'handset world-builder adaptation' styles/world-builder.css
          grep -q 'globalDomRollback' lib/chat-plugin-runtime.ts

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-worldbuilder-plugin.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/desktop-shell.tsx components/world-builder/WorldBuilder.tsx styles/world-builder.css lib/chat-plugin-runtime.ts .github/workflows/fix-worldbuilder-plugin.yml
          git commit -m 'fix world-builder mobile flow and plugin cleanup'
          git push
