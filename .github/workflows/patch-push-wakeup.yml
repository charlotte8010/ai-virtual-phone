name: Patch Android push reconnect

on:
  push:
    paths:
      - '.github/workflows/patch-push-wakeup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch PushService
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('android-shell/app/src/main/java/app/floatphone/shell/PushService.kt')
          s = p.read_text()
          s = s.replace(
              '    private var shellSubRegistered = false\n',
              '    private var shellSubRegistered = false\n    private val reconnectSignal = Object()\n',
              1,
          )
          s = s.replace(
              '            shellSubRegistered = false\n            socket?.cancel()\n',
              '            shellSubRegistered = false\n            socket?.cancel()\n            updateKeepAlive("正在连接个人云…")\n            synchronized(reconnectSignal) { reconnectSignal.notifyAll() }\n',
              1,
          )
          s = s.replace(
              '                updateKeepAlive("未登录或站点不可达，稍后重试")\n                sleepSec(60); continue\n',
              '                updateKeepAlive("等待个人云配置…")\n                waitForReconnect(5); continue\n',
              1,
          )
          s = s.replace(
              '            sleepSec(if (closedNormally) 3 else backoffSec)\n',
              '            waitForReconnect(if (closedNormally) 3 else backoffSec)\n',
              1,
          )
          marker = '    private fun sleepSec(sec: Long) {\n'
          helper = '    private fun waitForReconnect(sec: Long) {\n        synchronized(reconnectSignal) {\n            runCatching { reconnectSignal.wait(sec * 1000) }\n        }\n    }\n\n'
          assert marker in s
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY

      - name: Remove helper
        run: rm .github/workflows/patch-push-wakeup.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-shell/app/src/main/java/app/floatphone/shell/PushService.kt .github/workflows/patch-push-wakeup.yml
          git commit -m "apply immediate push reconnect patch"
          git push
