name: Reconcile Android status bar with Float setting

on:
  push:
    paths:
      - '.github/workflows/reconcile-system-status-bar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile native and web status-bar behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Android: top status bar follows Float's setting; bottom navigation stays visible.
          p = Path('android-shell/app/src/main/java/app/floatphone/shell/MainActivity.kt')
          s = p.read_text(encoding='utf-8')

          old = '''    private lateinit var webView: WebView\n    private var filePathCallback: ValueCallback<Array<Uri>>? = null\n'''
          new = '''    private lateinit var webView: WebView\n    private var filePathCallback: ValueCallback<Array<Uri>>? = null\n    private var systemStatusBarShown = true\n'''
          if old not in s:
              raise SystemExit('MainActivity field marker not found')
          s = s.replace(old, new, 1)

          old = '''    /**\n     * 普通 App 模式：Android 顶部状态栏和底部导航栏都常驻。\n     * 不再使用沉浸式/全屏系统栏策略，避免第一次边缘手势只把系统栏拉出来。\n     */\n    @Suppress("DEPRECATION")\n    private fun enterImmersiveMode() {\n        window.statusBarColor = Color.BLACK\n        window.navigationBarColor = Color.BLACK\n\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {\n            val attrs = window.attributes\n            attrs.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_DEFAULT\n            window.attributes = attrs\n        }\n\n        // WebView 完整布局在系统栏之间，上下系统栏始终可见。\n        WindowCompat.setDecorFitsSystemWindows(window, true)\n        WindowCompat.getInsetsController(window, window.decorView).apply {\n            show(WindowInsetsCompat.Type.systemBars())\n            isAppearanceLightStatusBars = false\n            isAppearanceLightNavigationBars = false\n        }\n\n        // 清空旧版 FULLSCREEN / HIDE_NAVIGATION / IMMERSIVE 等 flags。\n        window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE\n    }\n'''
          new = '''    /**\n     * 系统栏策略：顶部 Android 状态栏尊重 Float「显示系统状态栏」设置；\n     * 底部导航栏始终保持显示，避免边缘返回手势第一次只是在唤出系统栏。\n     */\n    @Suppress("DEPRECATION")\n    private fun applySystemBars() {\n        window.statusBarColor = Color.BLACK\n        window.navigationBarColor = Color.BLACK\n\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {\n            val attrs = window.attributes\n            attrs.layoutInDisplayCutoutMode = if (systemStatusBarShown) {\n                WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_DEFAULT\n            } else {\n                WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES\n            }\n            window.attributes = attrs\n        }\n\n        // 可见的系统栏由系统负责 inset：顶部隐藏时内容自然上移；底栏始终留出空间。\n        WindowCompat.setDecorFitsSystemWindows(window, true)\n        window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE\n        WindowCompat.getInsetsController(window, window.decorView).apply {\n            show(WindowInsetsCompat.Type.navigationBars())\n            if (systemStatusBarShown) {\n                show(WindowInsetsCompat.Type.statusBars())\n            } else {\n                hide(WindowInsetsCompat.Type.statusBars())\n            }\n            isAppearanceLightStatusBars = false\n            isAppearanceLightNavigationBars = false\n        }\n    }\n\n    private fun readSystemStatusBarPreference(url: String = SITE_URL): Boolean {\n        val cookies = CookieManager.getInstance().getCookie(url).orEmpty()\n        val mode = cookies.split(';')\n            .asSequence()\n            .map { it.trim() }\n            .firstOrNull { it.startsWith("pwa_display_mode=") }\n            ?.substringAfter('=')\n            ?.trim()\n        return mode == "standalone"\n    }\n\n    private fun syncSystemBarPreferenceFromCookie(url: String = SITE_URL) {\n        systemStatusBarShown = readSystemStatusBarPreference(url)\n        applySystemBars()\n    }\n'''
          if old not in s:
              raise SystemExit('MainActivity system bar block not found')
          s = s.replace(old, new, 1)

          old = '''        super.onCreate(savedInstanceState)\n        enterImmersiveMode()\n'''
          new = '''        super.onCreate(savedInstanceState)\n        systemStatusBarShown = readSystemStatusBarPreference()\n        applySystemBars()\n'''
          if old not in s:
              raise SystemExit('MainActivity onCreate first bar marker not found')
          s = s.replace(old, new, 1)

          old = '''        setContentView(webView)\n        enterImmersiveMode()\n'''
          new = '''        setContentView(webView)\n        applySystemBars()\n'''
          if old not in s:
              raise SystemExit('MainActivity setContentView bar marker not found')
          s = s.replace(old, new, 1)

          old = '''            override fun onPageFinished(view: WebView, url: String) {\n                super.onPageFinished(view, url)\n                syncPushConfigFromWebView()\n            }\n'''
          new = '''            override fun onPageFinished(view: WebView, url: String) {\n                super.onPageFinished(view, url)\n                syncSystemBarPreferenceFromCookie(url)\n                syncPushConfigFromWebView()\n            }\n'''
          if old not in s:
              raise SystemExit('MainActivity onPageFinished marker not found')
          s = s.replace(old, new, 1)

          old = '''    override fun onResume() {\n        super.onResume()\n        enterImmersiveMode()\n    }\n\n    override fun onWindowFocusChanged(hasFocus: Boolean) {\n        super.onWindowFocusChanged(hasFocus)\n        if (hasFocus) enterImmersiveMode()\n    }\n'''
          new = '''    override fun onResume() {\n        super.onResume()\n        syncSystemBarPreferenceFromCookie()\n    }\n\n    override fun onWindowFocusChanged(hasFocus: Boolean) {\n        super.onWindowFocusChanged(hasFocus)\n        if (hasFocus) applySystemBars()\n    }\n'''
          if old not in s:
              raise SystemExit('MainActivity lifecycle bar marker not found')
          s = s.replace(old, new, 1)

          old = '''        @JavascriptInterface\n        fun getVersion(): String = VERSION\n\n        /** 打开本应用的系统设置页（引导用户关电池限制、开自启动）。 */\n'''
          new = '''        @JavascriptInterface\n        fun getVersion(): String = VERSION\n\n        /** Float 外观设置切换系统状态栏时立即同步到原生窗口。 */\n        @JavascriptInterface\n        fun setSystemStatusBarShown(shown: Boolean) {\n            runOnUiThread {\n                systemStatusBarShown = shown\n                applySystemBars()\n            }\n        }\n\n        /** 打开本应用的系统设置页（引导用户关电池限制、开自启动）。 */\n'''
          if old not in s:
              raise SystemExit('MainActivity ShellBridge marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Web: central display preference setter notifies Android; safe-area no longer hardcodes Android as non-immersive.
          p = Path('lib/pwa-display-mode.ts')
          s = p.read_text(encoding='utf-8')

          old = '''export function writePwaDisplayPreference(preference: PwaDisplayPreference) {\n  if (typeof document === "undefined") return;\n  document.cookie = `${PWA_DISPLAY_MODE_COOKIE}=${preference}; path=/; max-age=31536000; samesite=lax`;\n  // 用户手动重新选择全屏时，允许再尝试一次浏览器 Fullscreen API。\n  fullscreenRequestAttempted = false;\n  window.dispatchEvent(new CustomEvent(PWA_DISPLAY_MODE_CHANGED_EVENT, { detail: preference }));\n}\n'''
          new = '''export function writePwaDisplayPreference(preference: PwaDisplayPreference) {\n  if (typeof document === "undefined") return;\n  document.cookie = `${PWA_DISPLAY_MODE_COOKIE}=${preference}; path=/; max-age=31536000; samesite=lax`;\n  // Android 壳不再自行强制顶部状态栏；直接尊重 Float 的这一个设置。\n  try {\n    const shellWindow = window as Window & {\n      AndroidShell?: { setSystemStatusBarShown?: (shown: boolean) => void };\n    };\n    shellWindow.AndroidShell?.setSystemStatusBarShown?.(preference === "standalone");\n  } catch {\n    // 浏览器/PWA 没有原生桥时照常使用 manifest / Fullscreen API。\n  }\n  // 用户手动重新选择全屏时，允许再尝试一次浏览器 Fullscreen API。\n  fullscreenRequestAttempted = false;\n  window.dispatchEvent(new CustomEvent(PWA_DISPLAY_MODE_CHANGED_EVENT, { detail: preference }));\n}\n'''
          if old not in s:
              raise SystemExit('pwa write preference marker not found')
          s = s.replace(old, new, 1)

          old = '''  // Float Android 壳现在固定采用普通 App 布局：顶部状态栏、底部导航栏都常驻。\n  // WebView 本身不一定报告 standalone，cookie 也可能还是旧的 fullscreen；\n  // 这里直接识别原生壳，避免自定义应用继续按沉浸全屏多预留一截 safe-area。\n  if (typeof window !== "undefined" && typeof navigator !== "undefined") {\n    const shellWindow = window as Window & { AndroidShell?: unknown };\n    if (typeof shellWindow.AndroidShell !== "undefined" || /FloatShell\\//i.test(navigator.userAgent)) return true;\n  }\n  return readPwaDisplayPreference(document.cookie) === "standalone"\n'''
          new = '''  // Android 壳也尊重同一份 cookie：standalone = 显示系统状态栏，\n  // fullscreen = 隐藏顶部系统栏并恢复 Float 自己的状态栏占位。\n  return readPwaDisplayPreference(document.cookie) === "standalone"\n'''
          if old not in s:
              raise SystemExit('pwa non-immersive Android override marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit reconciled behavior
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-shell/app/src/main/java/app/floatphone/shell/MainActivity.kt lib/pwa-display-mode.ts
          git commit -m "respect Float system status bar setting on Android"
          git push
