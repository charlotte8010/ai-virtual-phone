name: C5 Finalize Temp

on:
  push:
    branches:
      - feature/cognitive-memory

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'chore: repair C5 validation runner'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cognitive-memory
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply scoped C5 final-review fixes
        run: python scripts/c5-finalize-temp.py
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Commit verified C5 final fix
        shell: bash
        run: |
          git config user.name "Mimei8010"
          git config user.email "68415691+charlotte8010@users.noreply.github.com"
          git rm .github/workflows/c5-finalize-temp.yml scripts/c5-finalize-temp.py
          git add docs/float-cognitive-memory-engineering-plan.md \
            lib/llm-prompt-assembler.ts lib/memory-recall-stats.ts lib/memory-service.ts lib/memory-storage.ts \
            scripts/test-memory-recall-stats.mjs scripts/test-memory-prompt-recall-gate.mjs package.json
          git commit -m "fix: seal C5 recall stats and stability"
          git push origin HEAD:feature/cognitive-memory
