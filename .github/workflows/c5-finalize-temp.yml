name: C5 Finalize Temp

on:
  push:
    branches:
      - feature/cognitive-memory

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'chore: stage C5 final validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cognitive-memory
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply scoped C5 final-review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match in {path}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Roadmap numbering clarification after Cognitive/Migration branch split.
          roadmap = Path('docs/float-cognitive-memory-engineering-plan.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '''截至 2026-09-01，`feature/cognitive-memory` 已完成：

```text
Commit 1 — Types & Compatibility          ✅
Commit 2 — Atomic Extraction              ✅
Commit 3 — Future Intent Immediate Path   ✅
Commit 4 — Cognitive Retrieval v1         ✅
```
'''
          new = '''截至 2026-09-01，Cognitive 与 Migration 已正式拆分编号。`feature/cognitive-memory` 当前进度：

```text
C1 — Types & Compatibility          ✅
C2 — Atomic Extraction              ✅
C3 — Future Intent Immediate Path   ✅
C4 — Cognitive Retrieval v1         ✅
C5 — Recall Stats & Stability       ✅
C6 — Future Intent Lifecycle
C7 — Core Memory Guardrails
C8 — Debug Instrumentation
C9 — Memory Links & Spreading Activation
```

Migration 独立使用 M 系列编号：

```text
M1 — Foundation
M2 — Migration Package
M3 — Native Float Import
M4 — Cognitive & Extended Import
M5 — Validation / Rollback / UI
```

编号兼容说明：本文档后文若仍出现双分支拆分前的旧 unified 编号，应按以下映射理解：旧 Commit 8 = C5（Recall Stats & Stability）；旧 Commit 9 起的 Cognitive 阶段依次映射到 C6+。旧 Commit 5–7 的 Sully Migration 编号已废弃，迁移工程统一以 M1–M5 为准。此处只纠正工程编号，不改写既有 Git 历史。
'''
          if old not in text:
              raise SystemExit('roadmap progress block not found')
          text = text.replace(old, new, 1)
          text = text.replace('Commit 4 完成\n→ Cognitive Memory MVP 可玩', 'C4 完成\n→ Cognitive Memory MVP 可玩', 1)
          text = text.replace('Commit 5～7 完成\n→ Sully Full Backup Migration MVP', 'M1～M5 完成\n→ Sully Full Backup Migration MVP', 1)
          roadmap.write_text(text, encoding='utf-8')

          # Pure recall stats: stability can be disabled independently from access stats.
          replace_once('lib/memory-recall-stats.ts',
          '''/** Apply one successful prompt recall without changing memory chronology or lifecycle. */
export function applyRecallStats(memory: MemoryEntry, recalledAt: string): MemoryEntry {
    const accessCount = normalizeAccessCount(memory.accessCount) + 1;
    const currentStability = Number.isFinite(memory.stability)
        ? clamp(memory.stability as number, MIN_STABILITY, MAX_STABILITY)
        : getInitialStability(memory);

    return {
        ...memory,
        accessCount,
        lastAccessedAt: recalledAt,
        stability: clamp(
            currentStability + getRecallStabilityBoost(accessCount),
            MIN_STABILITY,
            MAX_STABILITY,
        ),
    };
}
''',
          '''export type RecallStatsOptions = {
    stabilityEnabled?: boolean;
};

/** Apply one successful prompt recall without changing memory chronology or lifecycle. */
export function applyRecallStats(
    memory: MemoryEntry,
    recalledAt: string,
    options: RecallStatsOptions = {},
): MemoryEntry {
    const accessCount = normalizeAccessCount(memory.accessCount) + 1;
    const base = {
        ...memory,
        accessCount,
        lastAccessedAt: recalledAt,
    };
    if (options.stabilityEnabled === false) return base;

    const currentStability = Number.isFinite(memory.stability)
        ? clamp(memory.stability as number, MIN_STABILITY, MAX_STABILITY)
        : getInitialStability(memory);

    return {
        ...base,
        stability: clamp(
            currentStability + getRecallStabilityBoost(accessCount),
            MIN_STABILITY,
            MAX_STABILITY,
        ),
    };
}
''')

          # Storage receives explicit stability policy while preserving one batch transaction.
          replace_once('lib/memory-storage.ts',
          '''export async function updateMemoryRecallStats(
    characterId: string,
    memoryIds: readonly string[],
    recalledAt: string,
): Promise<void> {''',
          '''export async function updateMemoryRecallStats(
    characterId: string,
    memoryIds: readonly string[],
    recalledAt: string,
    options: { stabilityEnabled?: boolean } = {},
): Promise<void> {''')
          replace_once('lib/memory-storage.ts',
          '''            store.put(applyRecallStats(normalizeMemoryEntry(entry), recalledAt));''',
          '''            store.put(applyRecallStats(normalizeMemoryEntry(entry), recalledAt, options));''')

          # Service reads the existing feature flag; disabling stability never disables recall stats.
          replace_once('lib/memory-service.ts',
          '''        await updateMemoryRecallStats(
            characterId,
            selectedIds,
            options.recalledAt ?? new Date().toISOString(),
        );''',
          '''        const config = loadMemoryConfig();
        await updateMemoryRecallStats(
            characterId,
            selectedIds,
            options.recalledAt ?? new Date().toISOString(),
            { stabilityEnabled: config.memoryStabilityEnabled !== false },
        );''')

          # Prompt blocks can carry a post-regex recall probe. The callback is queued only
          # when the memory contribution differs from the same final block without memory.
          replace_once('lib/llm-prompt-assembler.ts',
          '''    toolCallId?: string;
    toolName?: string;
};''',
          '''    toolCallId?: string;
    toolName?: string;
    recallBaselineText?: string;
    recallCallback?: () => void;
};''')

          replace_once('lib/llm-prompt-assembler.ts',
          '''    const blocks: PromptBlock[] = [];
    let longTermMemoryInjected = false;
    const timeAware = resolveTimeAware(input.timeAware);''',
          '''    const blocks: PromptBlock[] = [];
    const longTermMemoryCallbacks = new Set<() => void>();
    const timeAware = resolveTimeAware(input.timeAware);''')

          replace_once('lib/llm-prompt-assembler.ts',
          '''                    if (markerContent) {
                        if (p.identifier === "memoryLongTerm") longTermMemoryInjected = true;
                        const xmlText = wrapXml(toXmlTag(p.identifier), markerContent);
                        if (afterChatHistory) {''',
          '''                    if (markerContent) {
                        const xmlTag = toXmlTag(p.identifier);
                        const xmlText = wrapXml(xmlTag, markerContent);
                        const recallMeta = p.identifier === "memoryLongTerm" && input.onLongTermMemoriesInjected
                            ? {
                                recallBaselineText: wrapXml(xmlTag, ""),
                                recallCallback: input.onLongTermMemoriesInjected,
                            }
                            : {};
                        if (afterChatHistory) {''')
          replace_once('lib/llm-prompt-assembler.ts',
          '''                                marker: p.identifier,
                            });
                        } else {''',
          '''                                marker: p.identifier,
                                ...recallMeta,
                            });
                        } else {''')
          replace_once('lib/llm-prompt-assembler.ts',
          '''                                marker: p.identifier,
                            });
                        }
                    }
                }
                continue;''',
          '''                                marker: p.identifier,
                                ...recallMeta,
                            });
                        }
                    }
                }
                continue;''')

          # Single assembler post-input-regex gate.
          needle = '''        const processedText = b.role === "tool" ? b.text : applyInputRegex(b.text, regexes, inputCtx);
        const carriesNativeToolData = b.role === "tool" || Boolean(b.toolCalls?.length);
'''
          replacement = '''        const processedText = b.role === "tool" ? b.text : applyInputRegex(b.text, regexes, inputCtx);
        if (b.recallCallback && b.recallBaselineText !== undefined) {
            const baselineText = b.role === "tool"
                ? b.recallBaselineText
                : applyInputRegex(b.recallBaselineText, regexes, inputCtx);
            if (processedText.trim() && processedText !== baselineText) {
                longTermMemoryCallbacks.add(b.recallCallback);
            }
        }
        const carriesNativeToolData = b.role === "tool" || Boolean(b.toolCalls?.length);
'''
          p = Path('lib/llm-prompt-assembler.ts')
          source = p.read_text(encoding='utf-8')
          if source.count(needle) != 2:
              raise SystemExit(f'expected two aggregation sites, found {source.count(needle)}')
          source = source.replace(needle, replacement, 1)
          p.write_text(source, encoding='utf-8')

          replace_once('lib/llm-prompt-assembler.ts',
          '''    if (longTermMemoryInjected && input.onLongTermMemoriesInjected) {
        try {
            input.onLongTermMemoriesInjected();
        } catch (error) {
            console.warn("[PromptAssembler] Recall stats callback failed; continuing with prompt", error);
        }
    }
''',
          '''    for (const callback of longTermMemoryCallbacks) {
        try {
            callback();
        } catch (error) {
            console.warn("[PromptAssembler] Recall stats callback failed; continuing with prompt", error);
        }
    }
''')

          # Group assembler: attach callback to the actual member block plus a no-memory
          # counterfactual baseline, then evaluate it after input regex.
          replace_once('lib/llm-prompt-assembler.ts',
          '''    const longTermMemoryCallbacks: Array<() => void> = [];''',
          '''    const longTermMemoryCallbacks = new Set<() => void>();''')
          replace_once('lib/llm-prompt-assembler.ts',
          '''        const sections: string[] = [];
        let longTermMemoryInjected = false;''',
          '''        const sections: string[] = [];
        const sectionsWithoutLongTerm: string[] = [];
        let longTermMemorySeen = false;''')
          replace_once('lib/llm-prompt-assembler.ts',
          '''                    if (markerContent) {
                        if (p.identifier === "memoryLongTerm") longTermMemoryInjected = true;
                        sections.push(markerContent);
                    }''',
          '''                    if (markerContent) {
                        sections.push(markerContent);
                        if (p.identifier === "memoryLongTerm") {
                            longTermMemorySeen = true;
                        } else {
                            sectionsWithoutLongTerm.push(markerContent);
                        }
                    }''')
          replace_once('lib/llm-prompt-assembler.ts',
          '''        const memberContent = postProcessTrim([stateSection, ...sections].filter(Boolean).join("\n\n")).trim();
        if (memberContent) {
            blocks.push({
                text: `<member name="${char.name}">\n${memberContent}\n</member>`,
                role: "system",
                depth: beforeHistoryDepth,
                order: orderIdx++,
                marker: `member:${char.name}`,
            });
        }
        if (longTermMemoryInjected && m.onLongTermMemoriesInjected) {
            longTermMemoryCallbacks.push(m.onLongTermMemoriesInjected);
        }''',
          '''        const memberContent = postProcessTrim([stateSection, ...sections].filter(Boolean).join("\n\n")).trim();
        const memberContentWithoutLongTerm = postProcessTrim(
            [stateSection, ...sectionsWithoutLongTerm].filter(Boolean).join("\n\n"),
        ).trim();
        if (memberContent) {
            blocks.push({
                text: `<member name="${char.name}">\n${memberContent}\n</member>`,
                role: "system",
                depth: beforeHistoryDepth,
                order: orderIdx++,
                marker: `member:${char.name}`,
                ...(longTermMemorySeen && m.onLongTermMemoriesInjected
                    ? {
                        recallBaselineText: `<member name="${char.name}">\n${memberContentWithoutLongTerm}\n</member>`,
                        recallCallback: m.onLongTermMemoriesInjected,
                    }
                    : {}),
            });
        }''')

          # Replace the second aggregation site with the same post-regex probe.
          source = Path('lib/llm-prompt-assembler.ts').read_text(encoding='utf-8')
          if source.count(needle) != 1:
              raise SystemExit(f'expected one remaining group aggregation site, found {source.count(needle)}')
          source = source.replace(needle, replacement, 1)
          Path('lib/llm-prompt-assembler.ts').write_text(source, encoding='utf-8')

          # Extend recall tests for flag semantics and verify service forwards the real config flag.
          replace_once('scripts/test-memory-recall-stats.mjs',
          '''context.__recallWrites = [];
context.__failRecallWrites = false;''',
          '''context.__recallWrites = [];
context.__recallWriteOptions = [];
context.__failRecallWrites = false;''')
          replace_once('scripts/test-memory-recall-stats.mjs',
          '''        export async function updateMemoryRecallStats(characterId, memoryIds, recalledAt) {
            globalThis.__recallWrites.push({ characterId, memoryIds: [...memoryIds], recalledAt });
            if (globalThis.__failRecallWrites) throw new Error("simulated IndexedDB failure");
        }''',
          '''        export async function updateMemoryRecallStats(characterId, memoryIds, recalledAt, options = {}) {
            globalThis.__recallWrites.push({ characterId, memoryIds: [...memoryIds], recalledAt });
            globalThis.__recallWriteOptions.push({ ...options });
            if (globalThis.__failRecallWrites) throw new Error("simulated IndexedDB failure");
        }''')
          replace_once('scripts/test-memory-recall-stats.mjs',
          '''assert.equal(applyRecallStats(memory("bounded", { accessCount: 99, stability: 0.999 }), "now").stability, 1);
''',
          '''assert.equal(applyRecallStats(memory("bounded", { accessCount: 99, stability: 0.999 }), "now").stability, 1);

const stabilityDisabledExisting = applyRecallStats(memory("stability-off-existing", {
    accessCount: 3,
    stability: 0.4,
}), "2026-09-01T12:30:00.000Z", { stabilityEnabled: false });
assert.equal(stabilityDisabledExisting.accessCount, 4);
assert.equal(stabilityDisabledExisting.lastAccessedAt, "2026-09-01T12:30:00.000Z");
assert.equal(stabilityDisabledExisting.stability, 0.4, "disabled stability must preserve existing value");
const stabilityDisabledMissing = applyRecallStats(
    memory("stability-off-missing", { accessCount: 0 }),
    "2026-09-01T12:31:00.000Z",
    { stabilityEnabled: false },
);
assert.equal(stabilityDisabledMissing.accessCount, 1);
assert.equal(stabilityDisabledMissing.lastAccessedAt, "2026-09-01T12:31:00.000Z");
assert.equal(stabilityDisabledMissing.stability, undefined, "disabled stability must not initialize missing stability");

context.__testConfig = { ...config, memoryStabilityEnabled: false };
const optionsBeforeDisabledCommit = context.__recallWriteOptions.length;
await commitMemoryRecall("char-1", ["stability-disabled-service"], { recalledAt: "2026-09-01T12:32:00.000Z" });
assert.equal(context.__recallWriteOptions.length, optionsBeforeDisabledCommit + 1);
assert.equal(context.__recallWriteOptions.at(-1).stabilityEnabled, false);
context.__testConfig = { ...config };
await commitMemoryRecall("char-1", ["stability-default-service"], { recalledAt: "2026-09-01T12:33:00.000Z" });
assert.equal(context.__recallWriteOptions.at(-1).stabilityEnabled, true);
''')

          # Package script registration for real assembler gate tests.
          package = Path('package.json')
          pkg = package.read_text(encoding='utf-8')
          pkg = pkg.replace(
              'npm run test:memory-recall-stats && npm run test:migration-foundation',
              'npm run test:memory-recall-stats && npm run test:memory-prompt-recall-gate && npm run test:migration-foundation',
              1,
          )
          pkg = pkg.replace(
              '"test:memory-recall-stats": "node --no-warnings --experimental-vm-modules scripts/test-memory-recall-stats.mjs",',
              '"test:memory-recall-stats": "node --no-warnings --experimental-vm-modules scripts/test-memory-recall-stats.mjs",\n    "test:memory-prompt-recall-gate": "node --no-warnings --experimental-vm-modules scripts/test-memory-prompt-recall-gate.mjs",',
              1,
          )
          package.write_text(pkg, encoding='utf-8')
          PY

          cat > scripts/test-memory-prompt-recall-gate.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { dirname, extname, resolve } from "node:path";
          import { fileURLToPath } from "node:url";
          import * as ts from "typescript";
          import { createContext, SourceTextModule } from "node:vm";

          const repoRoot = resolve(dirname(fileURLToPath(import.meta.url)), "..");
          const context = createContext({ console });
          const assemblerPath = resolve(repoRoot, "lib/llm-prompt-assembler.ts");

          const macroSource = `
            export class MacroEngine {
              constructor(charName, userName) { this.charName = charName; this.userName = userName; }
              expand(value) {
                return String(value ?? "")
                  .replaceAll("{{char}}", this.charName ?? "")
                  .replaceAll("{{user}}", this.userName ?? "");
              }
            }
            export function postProcessTrim(value) { return String(value ?? ""); }
          `;
          const timeContextSource = `
            const value = { timeContext: "", systemTimeZone: "UTC", characterTime: "", characterTimeZone: "UTC", characterWeekday: "" };
            export function buildCharacterTimeContext() { return { ...value }; }
            export function buildGroupTimeContext() { return { ...value }; }
          `;
          const mockSources = new Map([
            [resolve(repoRoot, "lib/macro-engine.ts"), macroSource],
            [resolve(repoRoot, "lib/dwelling-storage.ts"), `export function readDwellingLayoutCache() { return null; }`],
            [resolve(repoRoot, "lib/dwelling-engine.ts"), `export function formatDwellingContext() { return ""; }`],
            [resolve(repoRoot, "lib/content-tag-utils.ts"), `export function matchesActiveTags() { return true; }`],
            [resolve(repoRoot, "lib/chat-share.ts"), `export function formatXiaohongshuShareForPrompt() { return ""; }`],
            [resolve(repoRoot, "lib/prompt-sanitizer.ts"), `export function stripStateAndInnerForPrompt(value) { return String(value ?? ""); }`],
            [resolve(repoRoot, "lib/prompt-time.ts"), `
              export function formatPromptTimestamp() { return ""; }
              export function getPromptTimestampOptionsForTimeContext() { return {}; }
              export function resolvePromptTimeAware() { return false; }
            `],
            [resolve(repoRoot, "lib/character-world-storage.ts"), `export function formatCharacterRelationsForPrompt() { return ""; }`],
            [resolve(repoRoot, "lib/character-time.ts"), timeContextSource],
            [resolve(repoRoot, "lib/shopping-payment-request.ts"), `export function formatShoppingPaymentRequestHistory() { return ""; }`],
            [resolve(repoRoot, "lib/group-admin.ts"), `export function buildGroupAdminBracketText() { return ""; }`],
          ]);

          const moduleCache = new Map();
          function modulePath(specifier, referencingModule) {
            if (specifier.startsWith("@/")) return resolve(repoRoot, `${specifier.slice(2)}.ts`);
            const base = resolve(dirname(referencingModule.identifier), specifier);
            return extname(base) ? base : `${base}.ts`;
          }
          async function loadModule(path) {
            const normalized = resolve(path);
            if (moduleCache.has(normalized)) return moduleCache.get(normalized);
            const source = mockSources.get(normalized) ?? await readFile(normalized, "utf8");
            const code = mockSources.has(normalized) ? source : ts.transpileModule(source, {
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
                moduleResolution: ts.ModuleResolutionKind.Bundler,
              },
            }).outputText;
            const mod = new SourceTextModule(code, { context, identifier: normalized });
            moduleCache.set(normalized, mod);
            await mod.link((specifier, referencingModule) => loadModule(modulePath(specifier, referencingModule)));
            return mod;
          }

          const mod = await loadModule(assemblerPath);
          await mod.evaluate();
          const { assemblePromptPayload, assembleGroupPromptPayload } = mod.namespace;

          const character = { id: "char-1", name: "角色", persona: "", personality: "" };
          function makePreset(enabled = true) {
            return {
              id: "preset-1", name: "test", description: "", createdAt: 0, updatedAt: 0,
              temperature: 1, top_p: 1, top_k: 0, frequency_penalty: 0, presence_penalty: 0,
              repetition_penalty: 1, openai_max_tokens: 1000, openai_max_context: 8000,
              prompts: [{
                identifier: "memoryLongTerm", name: "memoryLongTerm", role: "system", content: "",
                injection_depth: 0, enabled, marker: true, injection_position: 0,
              }],
              prompt_order: [{ identifier: "memoryLongTerm", enabled }],
            };
          }
          function clearMemoryRegex() {
            return [{
              id: "regex-group", name: "clear-memory", description: "", createdAt: 0, updatedAt: 0,
              rules: [{
                id: "rule-1", scriptName: "clear-memory", findRegex: "/<memoryLongTerm>[\\s\\S]*?<\\/memoryLongTerm>/g",
                replaceString: "", disabled: false, placement: [1], promptOnly: true,
              }],
            }];
          }
          function single({ enabled = true, memories = "记忆内容", regexes = [] } = {}) {
            let calls = 0;
            const payload = assemblePromptPayload({
              character, history: [], preset: makePreset(enabled), worldBooks: [], regexes,
              longTermMemories: memories, onLongTermMemoriesInjected: () => { calls += 1; },
            });
            return { calls, payload };
          }

          assert.equal(single({ enabled: false }).calls, 0, "disabled memoryLongTerm marker must not recall");
          assert.equal(single({ memories: "" }).calls, 0, "empty long-term memory must not recall");
          const injected = single();
          assert.equal(injected.calls, 1, "actual final long-term injection must recall exactly once");
          assert.ok(injected.payload.some(message => typeof message.content === "string" && message.content.includes("记忆内容")));
          const stripped = single({ regexes: clearMemoryRegex() });
          assert.equal(stripped.calls, 0, "input regex removing final memory content must suppress recall");
          assert.equal(stripped.payload.some(message => typeof message.content === "string" && message.content.includes("记忆内容")), false);

          function group(enabled = true) {
            let calls = 0;
            const payload = assembleGroupPromptPayload({
              members: [{
                character, worldBooks: [], longTermMemories: "群组长期记忆",
                onLongTermMemoriesInjected: () => { calls += 1; },
              }],
              history: [], preset: makePreset(enabled), regexes: [], userName: "User", groupName: "测试群",
            });
            return { calls, payload };
          }
          assert.equal(group(false).calls, 0, "disabled group memory marker must not recall");
          const groupInjected = group(true);
          assert.equal(groupInjected.calls, 1, "actual group final injection must recall exactly once");
          assert.ok(groupInjected.payload.some(message => typeof message.content === "string" && message.content.includes("群组长期记忆")));

          console.log("memory prompt recall gate tests passed");
          EOF

      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Commit verified C5 final fix
        shell: bash
        run: |
          git config user.name "Mimei8010"
          git config user.email "68415691+charlotte8010@users.noreply.github.com"
          git rm .github/workflows/c5-finalize-temp.yml
          git add docs/float-cognitive-memory-engineering-plan.md \
            lib/llm-prompt-assembler.ts lib/memory-recall-stats.ts lib/memory-service.ts lib/memory-storage.ts \
            scripts/test-memory-recall-stats.mjs scripts/test-memory-prompt-recall-gate.mjs package.json
          git commit -m "fix: seal C5 recall stats and stability"
          git push origin HEAD:feature/cognitive-memory
