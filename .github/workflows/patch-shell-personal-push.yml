name: Patch Android personal cloud push

on:
  push:
    paths:
      - '.github/workflows/patch-shell-personal-push.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/patch_shell_personal_push.py
      - name: Remove one-time helpers
        run: rm .github/workflows/patch-shell-personal-push.yml .github/scripts/patch_shell_personal_push.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apply Android personal cloud push patch"
          git push
