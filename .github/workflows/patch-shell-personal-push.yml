        val cookie = CookieManager.getInstance().getCookie(MainActivity.SITE_URL) ?: return null
'''
          new = '''    /**
     * 优先使用 APK 从网页个人云配置同步过来的参数。这样不依赖站点账号登录，
     * 也不会再卡在 /api/auth/me；旧站点 Cookie 方案仅保留作向后兼容兜底。
