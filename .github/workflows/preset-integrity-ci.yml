name: Preset Integrity Regression

on:
  push:
    branches: [fix/preset-gesture-stability-20260902]

jobs:
  preset-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:preset-integrity
