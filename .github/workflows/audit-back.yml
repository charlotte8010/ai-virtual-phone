name: Audit custom app and plugin runtime

on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-back.yml"]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture compact findings
        shell: bash
        run: |
          set -e
          git clone --depth=1 https://github.com/xiaolongbao0709/ai-virtual-phone-share.git /tmp/share >/dev/null 2>&1
          {
            echo '=== CUSTOM_APP_NAV ==='
            grep -nE 'srcDoc|<iframe|sandbox=|window\.open|location\.(href|assign|replace)|target=.*_blank|postMessage|onClose|safe-area|viewport' components/app-market/custom-app-runner.tsx 2>/dev/null | head -n 260 || true
            echo '=== CUSTOM_APP_CSS ==='
            grep -nE 'custom-app-runner|iframe|capsule|safe-area|100vh|100dvh|height:|width:' styles/app-market.css 2>/dev/null | head -n 260 || true
            echo '=== PLUGIN_MANAGER_DISABLE ==='
            grep -RInE 'stopPlugin|removePlugin|enabled[[:space:]]*[:=]|toggle.*plugin|update.*plugin|set.*enabled' components lib app --include='*.tsx' --include='*.ts' 2>/dev/null | head -n 360 || true
            echo '=== EXACT_DYNAMIC_BACKGROUND ==='
            grep -RInF '关闭动态背景' /tmp/share/资源 2>/dev/null | head -n 120 || true
            echo '=== DYNAMIC_CANDIDATES ==='
            find /tmp/share/资源 -type f -name '*.js' -print0 | xargs -0 -r grep -IlE '动态背景|关闭背景|背景动画|canvas.*background|background.*canvas|particle.*background' 2>/dev/null | head -n 120 || true
            echo '=== ZHUJING ==='
            grep -RInF '筑境' /tmp/share/资源 2>/dev/null | head -n 120 || true
          } > AUDIT_RUNTIME.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDIT_RUNTIME.txt
          git commit -m 'temporary runtime audit output'
          git push
