name: Patch global Android back

on:
  push:
    paths:
      - '.github/workflows/patch-global-android-back.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_global_android_back.py
      - name: Remove one-time patch files
        run: |
          rm -f .github/scripts/patch_global_android_back.py
          rm -f .github/workflows/patch-global-android-back.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix global Android back navigation'
          git push
